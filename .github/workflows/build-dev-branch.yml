name: Build Dev Branch

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get branch slug
        id: slug
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'versionName' mastodon/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' mastodon/build.gradle | head -1 | sed 's/[^0-9]*//g')
          COMMIT_SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}-dev.${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Build APK
        run: ./gradlew assembleGithubRelease

      - name: Decode keystore
        run: printf %s "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          UNSIGNED=$(find mastodon/build/outputs/apk/githubRelease -name "*.apk" | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $ZIPALIGN -v -p 4 "$UNSIGNED" kronk-aligned.apk
          $APKSIGNER sign --ks /tmp/release.jks \
            --ks-pass pass:"${KEYSTORE_PASSWORD}" \
            --ks-key-alias kronk \
            --out kronk-dev.apk \
            kronk-aligned.apk

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SLUG: ${{ steps.slug.outputs.slug }}
          BRANCH: ${{ steps.slug.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H kronk.info >> ~/.ssh/known_hosts 2>/dev/null

          APK_SIZE=$(stat -c%s "kronk-dev.apk")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          ssh -i ~/.ssh/deploy_key root@kronk.info "mkdir -p /var/www/kronk.info/dev/${SLUG}"
          scp -i ~/.ssh/deploy_key kronk-dev.apk root@kronk.info:/var/www/kronk.info/dev/${SLUG}/kronk.apk
          ssh -i ~/.ssh/deploy_key root@kronk.info \
            "echo '{\"version\":\"${VERSION}\",\"versionCode\":${VERSION_CODE},\"commit\":\"${COMMIT}\",\"branch\":\"${BRANCH}\",\"apkSize\":${APK_SIZE},\"apkUrl\":\"https://kronk.info/dev/${SLUG}/kronk.apk\",\"buildTime\":\"${BUILD_TIME}\"}' \
            > /var/www/kronk.info/dev/${SLUG}/version.json"

          # Write generate script and run it
          scp -i ~/.ssh/deploy_key \
            <(cat << 'PYEOF'
#!/usr/bin/env python3
import os, json

dev_dir = '/var/www/kronk.info/dev'
builds = []

root_vpath = os.path.join(dev_dir, 'version.json')
root_apk   = os.path.join(dev_dir, 'kronk.apk')
if os.path.exists(root_vpath) and os.path.exists(root_apk):
    with open(root_vpath) as f:
        data = json.load(f)
    builds.append({**data, 'displayBranch': 'development',
                   'apkUrl': 'https://kronk.info/dev/kronk.apk',
                   'isStable': True, 'mtime': os.path.getmtime(root_apk)})

for entry in sorted(os.listdir(dev_dir)):
    full = os.path.join(dev_dir, entry)
    vpath = os.path.join(full, 'version.json')
    apk   = os.path.join(full, 'kronk.apk')
    if os.path.isdir(full) and os.path.exists(vpath) and os.path.exists(apk):
        with open(vpath) as f:
            data = json.load(f)
        builds.append({**data, 'displayBranch': data.get('branch', entry),
                       'apkUrl': f'https://kronk.info/dev/{entry}/kronk.apk',
                       'isStable': False, 'mtime': os.path.getmtime(apk)})

builds.sort(key=lambda b: (0 if b.get('isStable') else 1, -b.get('mtime', 0)))

def fmt_size(n):
    return f"{n/1024/1024:.1f} MB" if n else ''

def card(b):
    branch = b.get('displayBranch', 'unknown')
    version = b.get('version', '')
    btime = b.get('buildTime', '')
    url = b.get('apkUrl', '')
    size = fmt_size(b.get('apkSize', 0))
    commit = b.get('commit', '')
    stable = b.get('isStable', False)
    badge = ('<span class="badge sb">development</span>' if stable
             else '<span class="badge bb">branch</span>')
    meta = ' &middot; '.join(v for v in [version, commit and f'#{commit}', size] if v)
    return (f'  <div class="card {"s" if stable else "b"}">\n'
            f'    <div class="ch"><span class="br">{branch}</span>{badge}</div>\n'
            f'    <div class="meta">{meta}</div>\n'
            + (f'    <div class="bt">{btime}</div>\n' if btime else '')
            + f'    <a class="btn" href="{url}" download>Install APK</a>\n  </div>')

cards = '\n'.join(card(b) for b in builds)
count = len(builds)

html = f"""<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kronk Dev Builds</title>
  <style>
    *,*::before,*::after{{box-sizing:border-box}}
    body{{margin:0;padding:24px 16px 48px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f0818;color:#e0d8f0;min-height:100vh}}
    h1{{margin:0 0 4px;font-size:1.7rem;color:#b97fff;letter-spacing:-.02em}}
    .sub{{margin:0 0 28px;color:#6a5888;font-size:.9rem}}
    .count{{color:#4a3868;font-size:.82rem;margin-bottom:14px}}
    .card{{background:#1a0f2a;border-radius:14px;padding:18px;margin-bottom:12px;border:1px solid #2a1a42}}
    .card.s{{background:#111828;border-color:#253060}}
    .ch{{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}}
    .br{{font-weight:600;font-size:.98rem;font-family:'SF Mono','Fira Code',monospace;word-break:break-all}}
    .badge{{font-size:.68rem;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}}
    .sb{{background:#1a2550;color:#6b8cff}}
    .bb{{background:#241540;color:#b97fff}}
    .meta{{color:#6a5888;font-size:.8rem;margin-bottom:4px}}
    .bt{{color:#4a3868;font-size:.76rem;margin-bottom:14px}}
    .btn{{display:block;background:#2e3d7a;color:#c8d4ff;text-align:center;padding:13px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.95rem}}
    .card.s .btn{{background:#243060;color:#b0c0ff}}
    .note{{margin-top:32px;padding:14px 16px;background:#140d22;border-radius:10px;border:1px solid #221540;color:#5a4878;font-size:.8rem;line-height:1.6}}
    .note strong{{color:#7a5898}}
  </style>
</head>
<body>
  <h1>Kronk Dev Builds</h1>
  <p class="sub">Development APKs &mdash; contributors and testers only</p>
  <div class="count">{count} build{{"s" if count != 1 else ""}} available</div>
{cards}
  <div class="note">
    <strong>To install:</strong> open this page in your Android browser, tap Install APK,
    then enable &ldquo;Install unknown apps&rdquo; for the browser if prompted.
    These builds are signed with the same key as the production app.
  </div>
</body>
</html>
"""

with open(os.path.join(dev_dir, 'index.html'), 'w') as f:
    f.write(html)
print(f"Generated index with {count} build(s)")
PYEOF
          ) root@kronk.info:/usr/local/bin/generate-dev-index.py
          ssh -i ~/.ssh/deploy_key root@kronk.info "chmod 755 /usr/local/bin/generate-dev-index.py && python3 /usr/local/bin/generate-dev-index.py"
          echo "Deployed ${BRANCH} (${VERSION}) to https://kronk.info/dev/${SLUG}/"
