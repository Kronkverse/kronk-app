name: Build Dev Branch

# Every feature/fix/docs branch gets the shadow app at
# kronk.info/dev/<branch-slug>/kronk.apk, to try before opening a PR.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  slug:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - id: slug
        run: |
          SLUG=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/-\+/-/g; s/^-//; s/-$//')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

  build:
    needs: slug
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      flavor: shadow
      dir: dev/${{ needs.slug.outputs.slug }}
      slug: ${{ needs.slug.outputs.slug }}
      channel: branch
