name: Build Development

# development → both apps, for testing before a release:
#   kronk.info/dev/kronk.apk       shadow app (opens shadow.kronk.info)
#   kronk.info/dev/live/kronk.apk  live app (opens kronk.info; installs over
#                                  the released app, same key)

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      flavor: shadow
      dir: dev
      slug: development
      channel: development
      stable: true

  live:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      flavor: live
      dir: dev/live
      slug: development-live
      channel: development
      stable: true
