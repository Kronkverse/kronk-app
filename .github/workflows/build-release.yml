name: Build and Release

# A tag v<appVersionName> (e.g. v2026.11) on main builds the live app,
# makes a GitHub release and puts it at kronk.info/kronk.apk with
# kronk.info/version.json. The legacy Mastodon-based app reads that
# version.json every 6 hours and offers the update, so this is what moves
# every installed phone. The tag must match appVersionName in app/build.gradle.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      flavor: live
      slug: production
      channel: production
      stable: true
      release: true
