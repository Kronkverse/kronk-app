name: Build APK

# The one build. Every other workflow calls this with a flavor and a place
# on kronk.info to put the result.
#
#   flavor  live   → info.kronk.app, opens kronk.info, release key (KEYSTORE_*)
#           shadow → info.kronk.app.shadow, opens shadow.kronk.info, SHADOW_KEYSTORE_*
#   dir     where under /var/www/kronk.info the APK and its version.json go;
#           'production' means the site root, which the legacy app's updater
#           reads, and is refused unless this is a live-flavor release

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      dir:
        type: string
        required: true
      slug:
        type: string
        required: true
      channel:
        type: string
        required: true
      stable:
        type: boolean
        default: false
      release:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Version
        id: version
        run: |
          NAME=$(sed -n "s/^def appVersionName = '\(.*\)'/\1/p" app/build.gradle)
          CODE=$(sed -n 's/^def appVersionCode = \([0-9]*\)/\1/p' app/build.gradle)
          COMMIT=${GITHUB_SHA::7}
          if [ "${{ inputs.release }}" = "true" ]; then
            TAG=${GITHUB_REF#refs/tags/v}
            if [ "$TAG" != "$NAME" ]; then
              echo "::error::Tag v$TAG does not match appVersionName $NAME in app/build.gradle"
              exit 1
            fi
            VERSION=$NAME
          else
            VERSION=$NAME-${{ inputs.flavor }}.$COMMIT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          FLAVOR=${{ inputs.flavor }}
          ./gradlew assemble${FLAVOR^}Release

      - name: Sign
        env:
          LIVE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          LIVE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHADOW_KEYSTORE: ${{ secrets.SHADOW_KEYSTORE_BASE64 }}
          SHADOW_PASSWORD: ${{ secrets.SHADOW_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ inputs.flavor }}" = "live" ]; then
            KEYSTORE=$LIVE_KEYSTORE; PASSWORD=$LIVE_PASSWORD; ALIAS=kronk
          else
            KEYSTORE=$SHADOW_KEYSTORE; PASSWORD=$SHADOW_PASSWORD; ALIAS=shadow
          fi
          printf %s "$KEYSTORE" | base64 -d > /tmp/sign.jks
          UNSIGNED=$(find app/build/outputs/apk/${{ inputs.flavor }}/release -name "*.apk" | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $ZIPALIGN -p 4 "$UNSIGNED" aligned.apk
          $APKSIGNER sign --ks /tmp/sign.jks --ks-pass pass:"$PASSWORD" --ks-key-alias $ALIAS \
            --out kronk.apk aligned.apk
          $APKSIGNER verify --print-certs kronk.apk
          rm /tmp/sign.jks

      - name: Release key is on kronk.info
        if: inputs.release
        # Without it the released app opens with a browser address bar, on
        # every phone the legacy updater moves. Ship the web release first.
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          FP=$($APKSIGNER verify --print-certs kronk.apk | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr a-f A-F | sed 's/../&:/g; s/:$//')
          if ! curl -fsS https://kronk.info/.well-known/assetlinks.json | grep -q "$FP"; then
            echo "::error::kronk.info/.well-known/assetlinks.json does not list $FP. Release the web side first."
            exit 1
          fi

      - name: Deploy to kronk.info
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DIR: ${{ inputs.dir }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H kronk.info >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key root@kronk.info"

          if [ "$DIR" = production ]; then
            if [ "${{ inputs.release }}" != true ] || [ "${{ inputs.flavor }}" != live ]; then
              echo "::error::Only a live-flavor release deploys to production"
              exit 1
            fi
            DIR=
          fi
          WEB=/var/www/kronk.info${DIR:+/$DIR}
          URL=https://kronk.info${DIR:+/$DIR}/kronk.apk
          SIZE=$(stat -c%s kronk.apk)
          TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          $SSH "mkdir -p $WEB"
          scp -i ~/.ssh/deploy_key kronk.apk root@kronk.info:$WEB/kronk.apk.new
          $SSH "mv $WEB/kronk.apk.new $WEB/kronk.apk"
          $SSH "echo '{\"version\":\"$VERSION\",\"versionCode\":$CODE,\"commit\":\"$COMMIT\",\"apkSize\":$SIZE,\"apkUrl\":\"$URL\",\"buildTime\":\"$TIME\"}' > $WEB/version.json"

          scp -i ~/.ssh/deploy_key .github/scripts/update-builds.py root@kronk.info:/usr/local/bin/update-kronk-builds.py
          $SSH "chmod 755 /usr/local/bin/update-kronk-builds.py"
          ENTRY=$(printf '{"branch":"%s","slug":"%s","channel":"%s","flavor":"%s","version":"%s","versionCode":%s,"commit":"%s","apkUrl":"%s","apkSize":%s,"buildTime":"%s","isStable":%s}' \
            "$GITHUB_REF_NAME" "${{ inputs.slug }}" "${{ inputs.channel }}" "${{ inputs.flavor }}" "$VERSION" "$CODE" "$COMMIT" "$URL" "$SIZE" "$TIME" "${{ inputs.stable }}")
          $SSH "python3 /usr/local/bin/update-kronk-builds.py upsert '$ENTRY'"

          echo "Deployed $VERSION to $URL"

      - name: GitHub release
        if: inputs.release
        run: |
          APK=kronk-${{ steps.version.outputs.version }}.apk
          cp kronk.apk $APK
          gh release upload "$GITHUB_REF_NAME" $APK --clobber 2>/dev/null ||
            gh release create "$GITHUB_REF_NAME" $APK \
              --title "Kronk ${{ steps.version.outputs.version }}" \
              --notes "Version ${{ steps.version.outputs.version }} (code ${{ steps.version.outputs.code }})"
        env:
          GH_TOKEN: ${{ github.token }}
