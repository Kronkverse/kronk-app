name: Cleanup Dev Branch

on:
  delete:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'

    steps:
      - uses: actions/checkout@v4

      - name: Get branch slug
        id: slug
        run: |
          BRANCH="${{ github.event.ref }}"
          SLUG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Remove build and update registry
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          if [ -z "$SLUG" ] || [ "$SLUG" = "." ] || [ "$SLUG" = ".." ] || [ "$SLUG" = "dev" ]; then
            echo "Skipping — slug '$SLUG' is not a valid branch build directory"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H kronk.info >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key root@kronk.info \
            "rm -rf /var/www/kronk.info/dev/${SLUG} && echo 'Removed /dev/${SLUG}'"

          # Deploy update script and remove from registry
          scp -i ~/.ssh/deploy_key .github/scripts/update-builds.py root@kronk.info:/usr/local/bin/update-kronk-builds.py
          ssh -i ~/.ssh/deploy_key root@kronk.info "chmod 755 /usr/local/bin/update-kronk-builds.py"
          ssh -i ~/.ssh/deploy_key root@kronk.info "python3 /usr/local/bin/update-kronk-builds.py remove '${SLUG}'"
