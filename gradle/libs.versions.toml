# Kronk Android app — Gradle version catalog.
#
# Central pin for dependency versions. When you bump a version, do it
# here — every module reads from `libs.<alias>` so the same version
# reaches every consumer.
#
# Scope for now: the new modules landing in the 2.0 rewrite
# (:core:common, :core:model, :core:designsystem, :app). The existing
# :mastodon module continues to declare its deps inline; migrating
# those into this catalog is a separate PR when the rewrite has more
# real consumers.
#
# Compose Compiler + BOM versions are aligned with what :mastodon
# already uses (compiler 1.5.8, BOM 2024.02.00) so we ship one set of
# Compose artifacts across the whole app.

[versions]

# Kotlin + Compose (aligned with :mastodon's current setup).
kotlin = "1.9.22"
kotlinxSerialization = "1.6.3"
composeCompiler = "1.5.8"
composeBom = "2024.02.00"
androidxCoreKtx = "1.13.1"
androidxActivityCompose = "1.8.2"

# Networking (used by :core:network — for the 2.0 rewrite's own Retrofit
# stack; :mastodon still uses its hand-rolled MastodonAPIController).
# Retrofit 2.11.0 ships its own kotlinx-serialization converter under
# retrofit2-kotlinx-serialization-converter — same artifact name as the
# JakeWharton one but published by Square as of 2.10.
okhttp = "4.12.0"
retrofit = "2.11.0"

# DI, storage, coroutines, lifecycle (:feature:auth and up).
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"
kotlinxCoroutines = "1.8.1"
androidxDatastore = "1.1.1"
androidxLifecycle = "2.8.4"
androidxBrowser = "1.8.0"
ksp = "1.9.22-1.0.17"

[libraries]

# Kotlin + Compose (used by :core:designsystem, :app, and later :feature:*).
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Serialization + networking (:core:network).
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

# DI + storage + lifecycle (:feature:auth and up).
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
