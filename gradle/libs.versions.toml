# Kronk Android app — Gradle version catalog.
#
# Central pin for every dependency version. When you bump a version,
# do it here — every module reads from `libs.<alias>` so the same
# version reaches every consumer.
#
# Kotlin + Compose + Hilt + Retrofit entries land alongside the
# `:core:*` modules in the 2.0 rewrite (Phase 1 of docs/rebuild/plan.md).
# This file starts with only what the existing Java app uses.

[versions]

# Android tooling
agp = "8.2.2"
secretsPlugin = "2.0.1"
desugarJdk = "2.0.3"

# AndroidX
androidxAnnotation = "1.3.0"

# Networking + serialization
okhttp = "3.14.9"
gson = "2.8.9"

# UI foundation (grishka.litex / appkit family + jsoup)
litexRecyclerView = "1.2.1.1"
litexSwipeRefreshLayout = "1.2.0-beta01"
litexBrowser = "1.4.0"
litexDynamicAnimation = "1.1.0-alpha03"
litexViewpager = "1.0.0"
litexViewpager2 = "1.0.0"
litexPalette = "1.0.0"
appkit = "1.4.8"
jsoup = "1.14.3"

# Event bus (Otto — legacy; targeted for removal in the Kotlin rewrite)
otto = "1.3.8"
asyncOtto = "1.0.3"

# QR codes, parcel, safe-parcel, zxing
zxing = "3.5.3"
safeParcel = "1.5.0"
parceler = "1.1.12"

# AppCenter (beta channels — retire alongside the AppCenter flavours)
appcenter = "5.0.4"

# Testing (currently unused; kept for parity with the existing declarations)
androidxTestCore = "1.5.0"
androidxTestJunit = "1.1.5"
androidxTestRunner = "1.5.2"
espresso = "3.5.1"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdk" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

litex-recyclerview = { module = "me.grishka.litex:recyclerview", version.ref = "litexRecyclerView" }
litex-swiperefreshlayout = { module = "me.grishka.litex:swiperefreshlayout", version.ref = "litexSwipeRefreshLayout" }
litex-browser = { module = "me.grishka.litex:browser", version.ref = "litexBrowser" }
litex-dynamicanimation = { module = "me.grishka.litex:dynamicanimation", version.ref = "litexDynamicAnimation" }
litex-viewpager = { module = "me.grishka.litex:viewpager", version.ref = "litexViewpager" }
litex-viewpager2 = { module = "me.grishka.litex:viewpager2", version.ref = "litexViewpager2" }
litex-palette = { module = "me.grishka.litex:palette", version.ref = "litexPalette" }
appkit = { module = "me.grishka.appkit:appkit", version.ref = "appkit" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

otto = { module = "com.squareup:otto", version.ref = "otto" }
async-otto = { module = "de.psdev:async-otto", version.ref = "asyncOtto" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
safe-parcel = { module = "org.microg:safe-parcel", version.ref = "safeParcel" }
parceler-api = { module = "org.parceler:parceler-api", version.ref = "parceler" }
parceler = { module = "org.parceler:parceler", version.ref = "parceler" }

appcenter-crashes = { module = "com.microsoft.appcenter:appcenter-crashes", version.ref = "appcenter" }
appcenter-distribute = { module = "com.microsoft.appcenter:appcenter-distribute", version.ref = "appcenter" }

androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsPlugin" }
