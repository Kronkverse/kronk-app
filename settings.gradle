dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		mavenLocal()
	}
}
rootProject.name = "Mastodon"
include ':mastodon'

// 2.0 rewrite (see docs/rebuild/plan.md).
// :core:common       — utilities, Result types, dispatchers (Kotlin-only).
// :core:model        — domain types (Account, Status, Reach, Krew, etc.).
// :core:designsystem — Compose theme + primitives (KronkTheme, Stage, MembraneNav).
// :app               — Kronk 2.0 composition root; installs alongside the
//                      legacy :mastodon app with applicationId
//                      "info.kronk.app.next" during the transition.
include ':core:common'
include ':core:model'
include ':core:designsystem'
include ':app'
