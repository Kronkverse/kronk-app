plugins {
	id 'com.android.application'
	id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
	androidResources {
		generateLocaleConfig = true
	}

	compileSdk 35
	defaultConfig {
		applicationId "info.kronk.app"
		minSdk 23
		targetSdk 35
		versionCode 160
		versionName "2.12.0"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
		debug{
			debuggable true
		}
		appcenterPrivateBeta{
			initWith release
			minifyEnabled false
			shrinkResources false
			versionNameSuffix "-priv-beta"
		}
		appcenterPublicBeta{
			initWith release
			versionNameSuffix "-beta"
		}
		githubRelease{
			initWith release
		}
		githubDebug{
			initWith debug
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		coreLibraryDesugaringEnabled true
	}
	sourceSets{
		appcenterPrivateBeta{
			setRoot "src/appcenter"
		}
		appcenterPublicBeta{
			setRoot "src/appcenter"
		}
		githubRelease{
			setRoot "src/github"
		}
		githubDebug{
			setRoot "src/github"
		}
	}
	lintOptions{
		checkReleaseBuilds false
		abortOnError false
	}
	buildFeatures{
		aidl true
		buildConfig true
	}
	dependenciesInfo{
		// Disables dependency metadata when building APKs.
		includeInApk false
		// Disables dependency metadata when building Android App Bundles.
		includeInBundle false
	}
	namespace 'org.joinmastodon.android'
}

// All dependency versions live in gradle/libs.versions.toml. Bump
// there, not here — every consumer reads from the same catalog.
dependencies {
	api libs.androidx.annotation
	implementation libs.okhttp
	implementation libs.litex.recyclerview
	implementation libs.litex.swiperefreshlayout
	implementation libs.litex.browser
	implementation libs.litex.dynamicanimation
	implementation libs.litex.viewpager
	implementation libs.litex.viewpager2
	implementation libs.litex.palette
	implementation libs.appkit
	implementation libs.gson
	implementation libs.jsoup
	implementation libs.otto
	implementation libs.async.otto
	implementation libs.zxing.core
	implementation libs.safe.parcel
	implementation libs.parceler.api
	annotationProcessor libs.parceler
	coreLibraryDesugaring libs.desugar.jdk.libs

	appcenterPrivateBetaImplementation libs.appcenter.crashes
	appcenterPrivateBetaImplementation libs.appcenter.distribute
	appcenterPublicBetaImplementation libs.appcenter.crashes
	appcenterPublicBetaImplementation libs.appcenter.distribute

	androidTestImplementation libs.androidx.test.core
	androidTestImplementation libs.androidx.test.junit
	androidTestImplementation libs.androidx.test.runner
	androidTestImplementation libs.espresso.core
}
