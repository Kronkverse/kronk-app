plugins {
	id 'com.android.application'
	id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
	id 'kotlin-android'
}

android {
	androidResources {
		generateLocaleConfig = true
	}

	compileSdk 35
	defaultConfig {
		applicationId "info.kronk.app"
		minSdk 23
		targetSdk 35
		versionCode 21401
		versionName "2.14.1"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
		debug{
			debuggable true
		}
		appcenterPrivateBeta{
			initWith release
			minifyEnabled false
			shrinkResources false
			versionNameSuffix "-priv-beta"
		}
		appcenterPublicBeta{
			initWith release
			versionNameSuffix "-beta"
		}
		githubRelease{
			initWith release
		}
		githubDebug{
			initWith debug
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		coreLibraryDesugaringEnabled true
	}
	kotlinOptions {
		jvmTarget = '17'
	}
	sourceSets{
		appcenterPrivateBeta{
			setRoot "src/appcenter"
		}
		appcenterPublicBeta{
			setRoot "src/appcenter"
		}
		githubRelease{
			setRoot "src/github"
		}
		githubDebug{
			setRoot "src/github"
		}
	}
	lintOptions{
		checkReleaseBuilds false
		abortOnError false
	}
	buildFeatures{
		aidl true
		buildConfig true
		compose true
	}
	composeOptions {
		kotlinCompilerExtensionVersion '1.5.8'
	}
	dependenciesInfo{
		// Disables dependency metadata when building APKs.
		includeInApk false
		// Disables dependency metadata when building Android App Bundles.
		includeInBundle false
	}
	namespace 'org.joinmastodon.android'
}

configurations.all {
	// Exclude real androidx versions that litex forks replace
	exclude group: 'androidx.recyclerview', module: 'recyclerview'
	exclude group: 'androidx.swiperefreshlayout', module: 'swiperefreshlayout'
	exclude group: 'androidx.viewpager', module: 'viewpager'
	exclude group: 'androidx.viewpager2', module: 'viewpager2'
	exclude group: 'androidx.browser', module: 'browser'
	exclude group: 'androidx.dynamicanimation', module: 'dynamicanimation'
	exclude group: 'androidx.palette', module: 'palette'
	exclude group: 'com.google.guava', module: 'listenablefuture'
	// Exclude OLD litex forks of collection/concurrent so Compose gets the real newer versions
	exclude group: 'me.grishka.litex', module: 'collection'
	exclude group: 'me.grishka.litex', module: 'concurrent'
	// profileinstaller crashes due to R8 renaming concurrent-futures internals; it's
	// a background perf optimiser with no functional impact when absent
	exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}

dependencies {
	api 'androidx.annotation:annotation:1.3.0'
	implementation 'com.squareup.okhttp3:okhttp:3.14.9'
	implementation 'me.grishka.litex:recyclerview:1.2.1.1'
	implementation 'me.grishka.litex:swiperefreshlayout:1.2.0-beta01'
	implementation 'me.grishka.litex:browser:1.4.0'
	implementation 'me.grishka.litex:dynamicanimation:1.1.0-alpha03'
	implementation 'me.grishka.litex:viewpager:1.0.0'
	implementation 'me.grishka.litex:viewpager2:1.0.0'
	implementation 'me.grishka.litex:palette:1.0.0'
	implementation 'me.grishka.appkit:appkit:1.4.8'
	implementation 'com.google.code.gson:gson:2.8.9'
	implementation 'org.jsoup:jsoup:1.14.3'
	implementation 'com.squareup:otto:1.3.8'
	implementation 'de.psdev:async-otto:1.0.3'
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'org.microg:safe-parcel:1.5.0'
	implementation 'org.parceler:parceler-api:1.1.12'
	annotationProcessor 'org.parceler:parceler:1.1.12'
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
	implementation 'com.google.android.flexbox:flexbox:3.0.0'

	def appCenterSdkVersion = "5.0.4"
	appcenterPrivateBetaImplementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
	appcenterPrivateBetaImplementation "com.microsoft.appcenter:appcenter-distribute:${appCenterSdkVersion}"
	appcenterPublicBetaImplementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
	appcenterPublicBetaImplementation "com.microsoft.appcenter:appcenter-distribute:${appCenterSdkVersion}"

	// Compose
	implementation platform('androidx.compose:compose-bom:2024.02.00')
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.ui:ui-graphics'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.animation:animation'
	implementation 'androidx.compose.foundation:foundation'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.activity:activity-compose:1.8.2'

	// CoordinatorLayout + Material (for BottomSheetBehavior)
	implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
	implementation 'com.google.android.material:material:1.12.0'

	androidTestImplementation 'androidx.test:core:1.5.0'
	androidTestImplementation 'androidx.test.ext:junit:1.1.5'
	androidTestImplementation 'androidx.test:runner:1.5.2'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
